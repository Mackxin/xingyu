<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- ===== 主题必须在样式表之前定下来 =====
     这里如果没有这段，浏览器会先按 <html> 上写死的 data-theme="dark" 画一帧，
     等 body 末尾的 app.js 跑完 initTheme 才改成你存的主题 —— 存的是浅色就会看见
     「先暗一下、然后整页变白」。放在 <head> 里同步执行，首帧就是对的颜色。
     取值顺序跟 app.js 的 initTheme() 完全一致，改那边记得回来同步：
       1. localStorage['xingyu.theme.v1']  —— 点过右上角切换按钮
       2. localStorage['xingyu.config.v1'].themeDefault —— 后台「站点信息 → 默认主题」
       3. 'dark' —— config.js 里 DEFAULTS.themeDefault 的兜底值 -->
<script>
(function () {
  var OK = function (v) { return v === 'light' || v === 'dark'; };
  var t = null;
  try { t = localStorage.getItem('xingyu.theme.v1'); } catch (e) {}
  if (!OK(t)) {
    t = null;
    try {
      var c = JSON.parse(localStorage.getItem('xingyu.config.v1') || 'null');
      if (c && OK(c.themeDefault)) t = c.themeDefault;
    } catch (e) {}
  }
  if (!OK(t)) t = 'dark';
  var el = document.documentElement;
  el.setAttribute('data-theme', t);
  /* 启动这段时间里所有颜色都是「一次设定」，不该出现 0.5s 的渐变（body 上带着
     transition:background .5s）。挂个标记先关掉过渡，app.js 初始化完就摘掉；
     万一 app.js 没跑起来，3 秒后自己摘，别让人一直没动效。 */
  el.className += ' xy-no-anim';
  setTimeout(function () { el.classList.remove('xy-no-anim'); }, 3000);
  var bg = (t === 'light' ? '#e8ecf7' : '#05060b');
  /* 样式表还没到的那几十毫秒也得有底色，否则暗色主题先看见一块白 */
  var st = document.createElement('style');
  st.textContent = 'html{background:' + bg + '}' +
    '.xy-no-anim *,.xy-no-anim *::before,.xy-no-anim *::after{transition:none !important}';
  (document.head || document.getElementsByTagName('head')[0]).appendChild(st);
  /* 地址栏那条 meta 在下面，这时还没解析到，只能等 DOM 建好再补；
     不补也不影响页面，只是地址栏会在 app.js 跑起来前用默认深色 */
  window.addEventListener('DOMContentLoaded', function () {
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', bg);
  });
})();
</script>

<!-- PWA：装到手机主屏后像 App 一样打开，并能离线查看已经访问过的内容。
     manifest 由脚本注入而不是直接写死在 head 里：浏览器取 manifest 时按规范是
     「不带 cookie」的，托管平台若按 URL 上的 ?sharecode=… 鉴权就会返回 403。
     这里把当前地址的查询串原样带上，GitHub Pages（没有查询串）与分享链接都能取到。 -->
<script>
(function () {
  var l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'manifest.webmanifest' + (location.search || '');
  document.head.appendChild(l);
})();
</script>
