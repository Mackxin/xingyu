<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060b" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#e8ecf7" media="(prefers-color-scheme: light)" />
<title>星屿 XingYu · 以星为图，以屿为家</title>
<meta name="description" content="星屿 —— 一座悬浮在夜色里的个人数字花园：精选导航、灵感分享与每日新发现。" />

<!-- ===== 分享卡片（微信 / 微博 / Slack / iMessage 等抓取这一组） =====
     og:image 必须是**完整网址**才能被大多数平台抓到，所以这里写死了线上地址。
     换成自己的域名后，把下面两处 https://mackxin.github.io/xingyu 一并替换掉即可。 -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://mackxin.github.io/xingyu/" />
<meta property="og:site_name" content="星屿 XINGYU" />
<meta property="og:title" content="星屿 · 以星为图，以屿为家" />
<meta property="og:description" content="一座悬浮在夜色里的个人数字花园：精选导航、灵感分享与每日新发现。" />
<meta property="og:image" content="https://mackxin.github.io/xingyu/assets/og-cover.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="星屿 · 以星为图，以屿为家" />
<meta name="twitter:description" content="一座悬浮在夜色里的个人数字花园：精选导航、灵感分享与每日新发现。" />
<meta name="twitter:image" content="https://mackxin.github.io/xingyu/assets/og-cover.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c9cff'/%3E%3Cstop offset='.55' stop-color='%23b47cff'/%3E%3Cstop offset='1' stop-color='%234fe3d0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%230a0c14'/%3E%3Cpath d='M16 5.5l2.4 7.6 7.6 2.4-7.6 2.4L16 25.5l-2.4-7.6L6 15.5l7.6-2.4z' fill='url(%23g)'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="https://mackxin.github.io/xingyu/assets/icon-180.png" />
<!-- PWA：装到手机主屏后像 App 一样打开，并能离线查看已经访问过的内容 -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="星屿" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- 订阅源：分享页的更新 -->
<link rel="alternate" type="application/rss+xml" title="星屿 · 灵感与文章" href="feed.xml" />
<link rel="stylesheet" href="assets/css/style.css?v=85" />
</head>
<body>

<!-- ============ 背景层 ============ -->
<div class="bg" aria-hidden="true">
  <span class="bg__orb bg__orb--a"></span>
  <span class="bg__orb bg__orb--b"></span>
  <span class="bg__orb bg__orb--c"></span>
  <span class="bg__grid"></span>
  <span class="bg__noise"></span>
  <span class="bg__vignette"></span>
</div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<!-- ============ 顶栏 ============ -->
<header class="header" id="header">
  <div class="header__inner">
    <a class="brand" href="#/home" aria-label="星屿 首页">
      <span class="brand__mark">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7c9cff"/><stop offset=".55" stop-color="#b47cff"/><stop offset="1" stop-color="#4fe3d0"/>
            </linearGradient>
          </defs>
          <path d="M16 4l2.7 8.4L27 15l-8.3 2.6L16 26l-2.7-8.4L5 15l8.3-2.6z" fill="url(#bg1)"/>
        </svg>
      </span>
      <span class="brand__text">
        <b id="brandName">星屿</b>
        <em id="brandLatin">XINGYU</em>
      </span>
    </a>

    <div class="header__row">
      <div class="header__search" id="headerSearchWrap">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input id="headerSearch" type="search" placeholder="搜索站点、分类…" autocomplete="off" spellcheck="false" aria-label="搜索站点与分类" />
        <button class="searchbox__clear" type="button" id="headerSearchClear" aria-label="清空搜索" title="清空">
          <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <!-- 手机 / 平板：分类折叠按钮（导航页置顶显示，点开是分类选择面板） -->
      <button class="hcat" id="headerCat" type="button" aria-haspopup="dialog" aria-expanded="false" title="切换分类">
        <span class="hcat__emoji" id="headerCatEmoji" aria-hidden="true">🗂</span>
        <span class="hcat__name" id="headerCatName">全部分类</span>
        <svg class="hcat__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg>
      </button>

      <!-- 手机 / 平板：分享页的标签筛选（跟分类按钮同一位置） -->
      <button class="hcat hcat--tag" id="headerTag" type="button" aria-haspopup="dialog" aria-expanded="false" title="按标签筛选">
        <span class="hcat__emoji" aria-hidden="true">🏷</span>
        <span class="hcat__name" id="headerTagName">全部标签</span>
        <svg class="hcat__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg>
      </button>
    </div>

    <!-- 后台里添加的自定义快捷链接（最多 5 个） -->
    <div class="header__links" id="headerLinks" hidden></div>

    <nav class="nav" id="nav" aria-label="主导航">
      <span class="nav__glider" id="navGlider" aria-hidden="true"></span>
      <a class="nav__item" href="#/home" data-route="home">首页</a>
      <a class="nav__item" href="#/nav"  data-route="nav">导航</a>
      <a class="nav__item" href="#/share" data-route="share">分享</a>
      <a class="nav__item" href="#/post" data-route="post">文章</a>
    </nav>

    <div class="header__actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ============ 手机端底部 tab 栏（≤640px 时顶栏胶囊移动到这里） ============ -->
<nav class="dock" id="dockNav" aria-label="主导航">
  <span class="nav__glider" id="dockGlider" aria-hidden="true"></span>
  <a class="nav__item" href="#/home" data-route="home">首页</a>
  <a class="nav__item" href="#/nav"  data-route="nav">导航</a>
  <a class="nav__item" href="#/share" data-route="share">分享</a>
  <a class="nav__item" href="#/post" data-route="post">文章</a>
</nav>

<!-- ============ 内容容器 ============ -->
<main class="app" id="app" tabindex="-1"></main>

<!-- ============ 页脚 ============ -->
<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <span class="footer__dot"></span>
      <b id="footerName">星屿 XINGYU</b>
      <span id="footerTagline">以星为图，以屿为家</span>
    </div>
    <div class="footer__meta">
      <button class="link-btn" id="randomBtn" type="button">🎲 随机漫游</button>
      <span class="sep">·</span>
      <button class="link-btn" id="keysBtn" type="button">⌨︎ 快捷键</button>
      <span class="sep">·</span>
      <a class="link-btn" href="feed.xml" target="_blank" rel="noopener" title="用 RSS 阅读器订阅「分享」的更新">📡 RSS</a>
      <span class="sep">·</span>
      <span class="footer__hint">⌘K 搜索 · ? 快捷键</span>
      <span class="sep">·</span>
      <button class="link-btn" id="adminBtn" type="button">⚙︎ 后台管理</button>
      <span class="sep">·</span>
      <span>© <span id="year">2026</span> 星屿</span>
    </div>
  </div>
</footer>

<!-- ============ 搜索面板 ============ -->
<div class="palette" id="palette" hidden>
  <div class="palette__scrim" data-palette-close></div>
  <div class="palette__panel" role="dialog" aria-modal="true" aria-label="全局搜索">
    <div class="palette__head">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input id="paletteInput" type="text" placeholder="搜索站点、分类或页面…" autocomplete="off" spellcheck="false" />
      <kbd class="palette__esc">ESC</kbd>
    </div>
    <div class="palette__list" id="paletteList"></div>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>↵</kbd> 打开</span>
      <span class="palette__hint" id="paletteHint">试试输入「设计」「AI」「音乐」</span>
    </div>
  </div>
</div>

<!-- ============ 快捷键说明 ============ -->
<div class="keys" id="keys" hidden>
  <div class="keys__scrim" data-keys-close></div>
  <div class="keys__panel" role="dialog" aria-modal="true" aria-label="键盘快捷键">
    <div class="keys__head">
      <b>键盘快捷键</b>
      <span class="keys__esc">ESC 关闭</span>
      <button class="keys__x" type="button" id="keysClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="keys__list" id="keysList"></div>
    <div class="keys__foot">全站可用；在输入框里打字时不会触发。手机端可点页脚「⌨︎ 快捷键」查看。</div>
  </div>
</div>

<!-- ============ 返回顶部 ============ -->
<button class="to-top" id="toTop" type="button" aria-label="返回顶部" title="返回顶部">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.5V5.8"/><path d="M5.8 12L12 5.8 18.2 12"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/config.js?v=85"></script>
<script src="assets/js/bookmarks.js?v=85"></script>
<script src="assets/js/data.js?v=85"></script>
<script src="assets/js/md.js?v=85"></script>
<script src="assets/js/app.js?v=85"></script>
<script src="assets/js/admin.js?v=85"></script>
</body>
</html>
