name: 重烘 App 数据

# 为什么需要它：全站内容就是 content/site.json 一个文件，改完要烘两样东西才上线 ——
#   1. content/site.json → assets/js/site-data.js（网站自己读的）
#   2. → api/app.json（App 读的）+ feed.xml（RSS）
# 在本机跑 tools/sync.py 时这些都烘好了；这个工作流管的是「在 GitHub 网页上直接改
# content/site.json」的情况 —— 手机、别人的电脑也能发一条分享，改完自动烘好并发布。
#
# 提交的是 site-data.js / app.json / feed.xml，都不在触发路径里，所以不会自己触自己。

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/js/site-data.js'
      - 'assets/js/bookmarks.js'
      - 'assets/js/data.js'
      - 'assets/js/feed-import.js'
      - 'assets/js/config.js'
      - 'assets/css/style.css'
      - 'data/help.md'
      - 'data/changelog.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebake
  cancel-in-progress: true

jobs:
  rebake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: content/site.json → site-data.js
        # 校验不过会直接失败（少个逗号之类），不会把坏数据发出去
        run: node tools/build-content.js

      - name: 重烘 app.json 与 feed.xml
        run: |
          node tools/gen-app-json.js --plain
          node tools/gen-feed.js

      - name: 烘焙 app.json.gz
        # 必须和 tools/sync.py 的 bake_gzip 逐字节一致（gzip.compress + mtime=0）。
        # 用 GzipFile(filename=...) 会多写一个 FNAME 头字段，同一份内容压出来字节不同，
        # 于是每次 CI 都会以为「有变化」并多提交一次。
        run: |
          python3 - <<'PY'
          import gzip, json
          raw = open('api/app.json', 'rb').read()
          buf = gzip.compress(raw, compresslevel=9, mtime=0)
          old = open('api/app.json.gz', 'rb').read()
          if buf == old:
              print('gz 没变，保持原样')
          else:
              open('api/app.json.gz', 'wb').write(buf)
              print('gz 已更新：', round(len(old) / 1024), 'KB →', round(len(buf) / 1024), 'KB')
          print('build', json.loads(raw.decode('utf-8')).get('build'))
          PY

      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-data.js api/app.json api/app.json.gz feed.xml
          if git diff --cached --quiet; then
            echo "内容没变，不需要提交"
            exit 0
          fi
          BUILD=$(python3 -c 'import json;print(json.load(open("api/app.json"))["build"])')
          git commit -m "自动重烘：content/site.json → site-data.js、api/app.json（build $BUILD）与 feed.xml"
          git push
