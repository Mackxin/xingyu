name: 重烘 App 数据

# 为什么需要它：后台「一键推送到 GitHub」只提交了 assets/js/site-data.js，
# 而 App 要的是 api/app.json —— 这份东西得跑 node 烘出来。
# 在仓库里烘，就不用再回本机跑一遍脚本了。
#
# 只在「内容 / 数据 / 样式」变的时候跑；提交的是 api/app.json 与 feed.xml，
# 不在触发路径里，所以不会自己触自己。

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/site-data.js'
      - 'assets/js/bookmarks.js'
      - 'assets/js/data.js'
      - 'assets/js/feed-import.js'
      - 'assets/js/config.js'
      - 'assets/css/style.css'
      - 'data/help.md'
      - 'data/changelog.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebake
  cancel-in-progress: true

jobs:
  rebake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 重烘 app.json 与 feed.xml
        run: |
          node tools/gen-app-json.js --plain
          node tools/gen-feed.js

      - name: 烘焙 app.json.gz
        # 必须和 tools/sync.py 的 bake_gzip 逐字节一致（gzip.compress + mtime=0）。
        # 用 GzipFile(filename=...) 会多写一个 FNAME 头字段，同一份内容压出来字节不同，
        # 于是每次 CI 都会以为「有变化」并多提交一次。
        run: |
          python3 - <<'PY'
          import gzip, json
          raw = open('api/app.json', 'rb').read()
          buf = gzip.compress(raw, compresslevel=9, mtime=0)
          old = open('api/app.json.gz', 'rb').read()
          if buf == old:
              print('gz 没变，保持原样')
          else:
              open('api/app.json.gz', 'wb').write(buf)
              print('gz 已更新：', round(len(old) / 1024), 'KB →', round(len(buf) / 1024), 'KB')
          print('build', json.loads(raw.decode('utf-8')).get('build'))
          PY

      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/app.json api/app.json.gz feed.xml
          if git diff --cached --quiet; then
            echo "内容没变，不需要提交"
            exit 0
          fi
          BUILD=$(python3 -c 'import json;print(json.load(open("api/app.json"))["build"])')
          git commit -m "自动重烘：api/app.json（build $BUILD）与 feed.xml 跟上内容改动"
          git push
